{% extends 'base.html' %}
{% block title %}Create Account | Job Board{% endblock title %}
{% block content %}
<style>
	.signup-page {
		display: grid;
		min-height: calc(100vh - 76px);
		place-items: center;
		padding: 48px 24px;
		background: #F4F7FB;
	}

	.signup-panel {
		width: min(100%, 520px);
		padding: 36px;
		border: 1px solid #E1E8F0;
		border-radius: 8px;
		background: #FFFFFF;
		box-shadow: 0 12px 36px rgba(16, 42, 67, 0.08);
	}

	.signup-heading { margin-bottom: 28px; }
	.signup-heading h1 { margin: 0 0 8px; color: #102A43; font-size: 28px; }
	.signup-heading p { margin: 0; color: #718096; font-size: 14px; line-height: 1.5; }
	.signup-fields { display: grid; gap: 17px; }
	.signup-name-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
	.signup-field { display: grid; gap: 7px; }
	.signup-field label { color: #486581; font-size: 12px; font-weight: 500; }
	.signup-field input {
		width: 100%;
		height: 46px;
		padding: 0 13px;
		border: 1px solid #CBD5E1;
		border-radius: 6px;
		outline: none;
		background: #FFFFFF;
		color: #102A43;
		font: 400 13px 'Inter', sans-serif;
	}
	.signup-field input::placeholder { color: #9AAABD; }
	.signup-field input:focus { border-color: #1D4ED8; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12); }
	.signup-submit {
		width: 100%;
		min-height: 46px;
		margin-top: 5px;
		border: 1px solid #102A43;
		border-radius: 6px;
		background: #102A43;
		color: #FFFFFF;
		font: 500 14px 'Inter', sans-serif;
		cursor: pointer;
		transition: background-color .15s;
	}
	.signup-submit:hover { background: #1D4ED8; }
	.signup-footnote { margin: 20px 0 0; color: #718096; font-size: 12px; text-align: center; }
	.signup-footnote a { color: #2563EB; font-weight: 500; text-decoration: none; }
	.signup-footnote a:hover { text-decoration: underline; }

	@media (max-width: 520px) {
		.signup-page { padding: 28px 16px; }
		.signup-panel { padding: 26px 20px; }
		.signup-name-row { grid-template-columns: 1fr; }
	}
</style>

<section class="signup-page">
	<div class="signup-panel">
		<header class="signup-heading">
			<h1>Create your account</h1>
			<p>Join Job Board to save opportunities and keep your search organized.</p>
		</header>

		<form method="post" class="signup-fields">
			{% csrf_token %}
			<div class="signup-name-row">
				<div class="signup-field">
					<label for="signup-first-name">First name</label>
					<input id="signup-first-name" name="first_name" type="text" autocomplete="given-name" placeholder="First name" required>
				</div>
				<div class="signup-field">
					<label for="signup-last-name">Last name</label>
					<input id="signup-last-name" name="last_name" type="text" autocomplete="family-name" placeholder="Last name" required>
				</div>
			</div>
			<div class="signup-field">
				<label for="signup-email">Email address</label>
				<input id="signup-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
			</div>
			<div class="signup-field">
				<label for="signup-password">Password</label>
				<input id="signup-password" name="password1" type="password" autocomplete="new-password" placeholder="Create a password" required>
			</div>
			<div class="signup-field">
				<label for="signup-password-confirm">Confirm password</label>
				<input id="signup-password-confirm" name="password2" type="password" autocomplete="new-password" placeholder="Enter your password again" required>
			</div>
			<button class="signup-submit" type="submit">Create account</button>
		</form>

		<p class="signup-footnote">Already have an account? <a href="#login">Login</a></p>
	</div>
</section>
{% endblock content %}
