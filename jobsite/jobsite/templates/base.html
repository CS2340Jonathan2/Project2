{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Job Board{% endblock title %}</title>
  <link rel="stylesheet" type="text/css" href="{% static 'css/style.css' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background-color: #F7F9FC;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: #102A43;
    }

    /* ── Navbar ── */
    .navbar {
      background-color: #0F2747;
      height: 76px;
      display: flex;
      align-items: center;
      padding: 0 32px;
      gap: 40px;
      flex-shrink: 0;
    }

    .navbar-brand {
      font-size: 20px;
      font-weight: 400;
      color: #ffffff;
      text-decoration: none;
      letter-spacing: 0.02em;
      white-space: nowrap;
      margin-right: auto;
    }

    .navbar-links {
      display: flex;
      align-items: center;
      gap: 40px;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .navbar-links a {
      font-size: 12px;
      font-weight: 400;
      color: #C7D5E8;
      text-decoration: none;
    }

    .navbar-links a:hover { color: #ffffff; }

    .navbar-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background-color: #DBEAFE;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 400;
      color: #1D4ED8;
      flex-shrink: 0;
      margin-left: 8px;
    }

    /* ── Page body ── */
    .page-body {
      flex: 1;
      display: block;
    }

    .content {
      width: 100%;
      min-height: calc(100vh - 76px);
    }

    .home-layout {
      display: grid;
      grid-template-columns: 3fr 4fr;
      min-height: calc(100vh - 76px);
    }

    .home-left {
      background-color: #173F73;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 42px;
      padding: 64px clamp(28px, 5vw, 76px);
    }

    .home-left .home-section {
      max-width: 440px;
    }

    .home-left .home-section h2 {
      margin: 0 0 12px;
      color: #ffffff;
      font-size: 26px;
    }

    .home-left .home-section p {
      margin: 0;
      color: #ffffff;
      line-height: 1.7;
    }

    .home-right {
      display: flex;
      align-items: center;
      padding: clamp(36px, 7vw, 104px);
      color: #ffffff;
      background-image: linear-gradient(rgba(15, 39, 71, 0.42), rgba(15, 39, 71, 0.42)), url("{% static 'img/officebg.jpg' %}");
      background-size: cover;
      background-position: center;
    }

    .home-right-content {
      max-width: 660px;
    }

    .home-right h1 {
      margin: 0 0 20px;
      font-size: 48px;
      line-height: 1.12;
    }

    .home-right p {
      max-width: 600px;
      margin: 0;
      color: #ffffff;
      font-size: 19px;
      line-height: 1.65;
    }

    /* ── Left panel ── */
    .left-panel {
      background-color: #173F73;
      width: 41%;
      min-height: 100%;
      padding: 80px 48px 80px 48px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .left-panel-headline {
      font-size: 40px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.15;
      letter-spacing: -1.6px;
      margin: 0 0 20px 0;
    }

    .left-panel-sub {
      font-size: 20px;
      font-weight: 500;
      color: #D8E7F7;
      line-height: 1.4;
      margin: 0 0 48px 0;
    }

    .feature-card {
      background-color: #24528A;
      border-radius: 16px;
      padding: 28px 32px 32px 32px;
      max-width: 430px;
    }

    .feature-card-title {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      margin: 0 0 14px 0;
    }

    .feature-card-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .feature-card-list li {
      font-size: 16px;
      font-weight: 400;
      color: #D8E7F7;
    }

    /* ── Right panel ── */
    .right-panel {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 32px;
    }

    .signin-card {
      width: 100%;
      max-width: 520px;
    }

    .signin-title {
      font-size: 36px;
      font-weight: 400;
      color: #102A43;
      margin: 0 0 10px 0;
    }

    .signin-subtitle {
      font-size: 16px;
      font-weight: 400;
      color: #718096;
      margin: 0 0 32px 0;
    }

    /* ── Form ── */
    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 400;
      color: #486581;
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      height: 55px;
      border: 1px solid #CBD5E1;
      border-radius: 10px;
      background-color: #ffffff;
      padding: 0 16px;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 400;
      color: #102A43;
      outline: none;
      transition: border-color 0.15s;
    }

    .form-input::placeholder { color: #718096; }

    .form-input:focus { border-color: #2563EB; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }

    .forgot-link {
      display: block;
      text-align: right;
      font-size: 12px;
      font-weight: 400;
      color: #2563EB;
      text-decoration: none;
      margin-top: 8px;
      margin-bottom: 24px;
    }

    .forgot-link:hover { text-decoration: underline; }

    .btn-signin {
      width: 100%;
      height: 57px;
      background-color: #2563EB;
      border: 1px solid #2563EB;
      border-radius: 12px;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      font-weight: 400;
      cursor: pointer;
      transition: background-color 0.15s;
    }

    .btn-signin:hover { background-color: #1D4ED8; }

    .register-link {
      display: block;
      text-align: center;
      font-size: 12px;
      font-weight: 400;
      color: #718096;
      margin-top: 20px;
    }

    .register-link a {
      color: #2563EB;
      text-decoration: none;
    }

    .register-link a:hover { text-decoration: underline; }

    /* ── Error messages ── */
    .error-list {
      background-color: #FEE2E2;
      border: 1px solid #FCA5A5;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 20px;
      font-size: 12px;
      color: #991B1B;
      list-style: none;
    }

    .field-error {
      font-size: 11px;
      color: #DC2626;
      margin-top: 4px;
    }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .navbar-links { display: none; }
      .navbar-avatar { display: none; }

      .home-layout { grid-template-columns: 1fr; }
      .home-left { gap: 32px; padding: 48px 28px; }
      .home-right { min-height: 52vh; padding: 48px 28px; }
      .home-right h1 { font-size: 36px; }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="/" class="navbar-brand">JOB BOARD</a>
    <ul class="navbar-links">
      <li><a href="/#opportunities">Find Jobs</a></li>
      <li><a href="/#how-it-works">How It Works</a></li>
    </ul>
    <div class="navbar-avatar" aria-label="Job Board">JB</div>
  </nav>

  <main class="page-body">
    {% block content %}{% endblock content %}
  </main>

</body>
</html>
