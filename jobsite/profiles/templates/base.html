{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Job Board{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/jobs/">Job Board</a>
    <nav aria-label="Main navigation">
      <a href="/jobs/">Find jobs</a>
      <a href="/jobs/map/">Map</a>
      <a href="/cart/">Job cart</a>
      <a href="/cart/applications/">Applications</a>
      <a href="/profile/">Profile</a>
    </nav>
  </header>
  <main class="page-shell">{% block content %}{% endblock %}</main>
</body>
</html>
