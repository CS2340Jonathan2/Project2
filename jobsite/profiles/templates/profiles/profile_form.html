{% extends "base.html" %}
{% block title %}{% if creating %}Create Profile{% else %}Edit Profile{% endif %} — JobSite{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h3 class="card-title mb-4">{% if creating %}Create Your Profile{% else %}Edit Profile{% endif %}</h3>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary mt-2">{% if creating %}Create{% else %}Save changes{% endif %}</button>
                    <a href="/" class="btn btn-outline-secondary mt-2 ms-2">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
