{% extends "base.html" %}
{% block title %}Log in — JobSite{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h3 class="card-title mb-4">Log in</h3>
                {% if form.errors %}
                <div class="alert alert-danger">Incorrect username or password. Please try again.</div>
                {% endif %}
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <input type="hidden" name="next" value="{{ next }}" />
                    <button type="submit" class="btn btn-primary w-100">Log in</button>
                </form>
                <hr>
                <p class="text-center mb-0">Don't have an account? <a href="/signup/">Sign up</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
