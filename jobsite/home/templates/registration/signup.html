{% extends "base.html" %}
{% block title %}Sign up — JobSite{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h3 class="card-title mb-4">Create an account</h3>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100 mt-2">Create account</button>
                </form>
                <hr>
                <p class="text-center mb-0">Already have an account? <a href="/accounts/login/">Log in</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
