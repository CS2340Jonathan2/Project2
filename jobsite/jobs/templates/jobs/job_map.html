{% extends "base.html" %}
{% block title %}Job Map — JobSite{% endblock %}

{% block main %}
<div style="display:flex; flex-direction:column; height:calc(100vh - 56px);">
    <div style="padding:10px 16px; background:#f8f9fa; border-bottom:1px solid #dee2e6; display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
        <input id="radius" type="number" class="form-control form-control-sm" style="width:160px;"
               placeholder="Radius (miles)" min="1" max="500" />
        <button class="btn btn-primary btn-sm" onclick="locateAndLoad()">Use my location</button>
        <button class="btn btn-outline-secondary btn-sm" onclick="loadAll()">Show all jobs</button>
        <span id="status" class="text-muted small"></span>
    </div>
    <div id="map" style="flex:1;"></div>
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const map = L.map('map').setView([33.749, -84.388], 10);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles &copy; Esri &mdash; Source: Esri, HERE, Garmin, USGS',
        maxZoom: 19
    }).addTo(map);

    let markers = [];

    function clearMarkers() {
        markers.forEach(m => m.remove());
        markers = [];
    }

    function renderJobs(data) {
        clearMarkers();
        document.getElementById('status').textContent = `${data.count} job${data.count !== 1 ? 's' : ''} found`;
        data.jobs.forEach(job => {
            const popup = `
                <strong>${job.title}</strong><br>
                ${job.location}${job.is_remote ? ' · Remote' : ''}<br>
                ${job.salary_min ? '$' + job.salary_min.toLocaleString() : ''}
                ${job.salary_max ? ' – $' + job.salary_max.toLocaleString() : ''}<br>
                ${job.distance_miles !== null ? `${job.distance_miles} mi away` : ''}
                ${job.visa_sponsorship ? '<br>Visa sponsorship' : ''}
            `;
            const m = L.marker([job.latitude, job.longitude]).bindPopup(popup);
            m.addTo(map);
            markers.push(m);
        });
    }

    function loadAll() {
        fetch('/jobs/map-data/')
            .then(r => r.json())
            .then(renderJobs);
    }

    function locateAndLoad() {
        if (!navigator.geolocation) {
            document.getElementById('status').textContent = 'Geolocation not supported.';
            return;
        }
        document.getElementById('status').textContent = 'Locating…';
        navigator.geolocation.getCurrentPosition(pos => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            const radius = document.getElementById('radius').value;
            const url = `/jobs/map-data/?lat=${lat}&lng=${lng}${radius ? '&radius=' + radius : ''}`;
            map.setView([lat, lng], 11);
            fetch(url).then(r => r.json()).then(renderJobs);
        }, () => {
            document.getElementById('status').textContent = 'Could not get location.';
        });
    }

    loadAll();
</script>
{% endblock %}
