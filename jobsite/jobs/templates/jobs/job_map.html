{% extends "base.html" %}

{% block title %}Job map{% endblock %}

{% block content %}
<style>
  .map-layout {
    display: grid;
    grid-template-columns: 360px minmax(0, 1fr);
    gap: 20px;
    align-items: start;
  }
  .job-map {
    height: 70vh;
    min-height: 480px;
    border: 1px solid #E1E8F0;
    border-radius: 8px;
  }
  @media (max-width: 800px) {
    .map-layout { grid-template-columns: 1fr; }
  }
  .radius-field { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; }
  .radius-field legend { padding: 0; margin-bottom: 4px; }
  .radius-option { display: flex; gap: 8px; align-items: center; font-size: 14px; }
  .radius-option small { color: #718096; }
  .radius-custom { display: flex; gap: 8px; align-items: center; }
  .radius-custom input { width: 110px; }
  .radius-custom input:disabled { background: #F1F5F9; color: #9AAABD; cursor: not-allowed; }
</style>

<section class="page-heading jobs-heading">
  <p class="eyebrow">Location search</p>
  <h1>Jobs near you</h1>
  <p>Choose a location and commute radius to find opportunities nearby.</p>
</section>

<section class="map-layout">
  <aside class="map-panel" aria-label="Map controls and job results">
    <form id="map-filters" class="map-filters">
      <div class="filter-field">
        <label for="map-location">Starting location</label>
        <input id="map-location" value="Georgia Tech, Atlanta" placeholder="City or address">
      </div>

      <fieldset class="filter-field radius-field">
        <legend>Commute distance</legend>

        <label class="radius-option">
          <input type="radio" name="radius-mode" value="preferred"
                 {% if preferred_radius %}checked{% else %}disabled{% endif %}>
          <span>
            Use my preferred commute
            {% if preferred_radius %}({{ preferred_radius }} mi){% else %}<small>(log in and create a profile to use this)</small>{% endif %}
          </span>
        </label>

        <label class="radius-option">
          <input type="radio" name="radius-mode" value="custom"
                 {% if not preferred_radius %}checked{% endif %}>
          <span>Enter a distance manually</span>
        </label>

        <div class="radius-custom">
          <input id="radius" type="number" min="0.1" step="any" value="10"
                 inputmode="decimal" aria-label="Distance in miles"
                 {% if preferred_radius %}disabled{% endif %}>
          <span>miles</span>
        </div>
      </fieldset>

      <button class="button button-primary map-update" type="submit">Update map</button>
      <button class="button button-secondary" id="use-location" type="button">Use my location</button>
    </form>

    <div class="map-results-heading">
      <h2 id="map-result-count">Loading jobs…</h2>
      <p id="map-status" class="empty-copy" aria-live="polite"></p>
    </div>
    <div id="map-job-list" class="map-job-list"></div>
  </aside>

  <div id="job-map" class="job-map" role="region" aria-label="Interactive job map"></div>
</section>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
(() => {
  const defaultCenter = [33.7756, -84.3963];
  const map = L.map('job-map').setView(defaultCenter, 11);
  const markers = L.layerGroup().addTo(map);
  const circleLayer = L.layerGroup().addTo(map);

  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19,
    attribution: 'Tiles &copy; Esri'
  }).addTo(map);

  const form = document.querySelector('#map-filters');
  const locationInput = document.querySelector('#map-location');
  const radiusInput = document.querySelector('#radius');
  const modeInputs = document.querySelectorAll('input[name="radius-mode"]');
  const resultCount = document.querySelector('#map-result-count');
  const status = document.querySelector('#map-status');
  const list = document.querySelector('#map-job-list');
  const preferredRadius = {{ preferred_radius|default:"null" }};

  let center = defaultCenter;
  let lastQuery = locationInput.value;  // matches the default center

  const money = value => value == null ? '' : `$${Number(value).toLocaleString()}`;
  const applyUrlTemplate = "{% url 'jobs:apply' 0 %}";  // renders as /jobs/0/apply/
  const applyUrl = id => applyUrlTemplate.replace('/0/', `/${id}/`);

  function getRadius() {
    const mode = document.querySelector('input[name="radius-mode"]:checked').value;
    if (mode === 'preferred' && preferredRadius) return preferredRadius;
    const value = parseFloat(radiusInput.value);
    return value > 0 ? value : null;
  }

  function syncRadiusMode() {
    const mode = document.querySelector('input[name="radius-mode"]:checked').value;
    radiusInput.disabled = mode !== 'custom';
  }

  modeInputs.forEach(input => input.addEventListener('change', () => {
    syncRadiusMode();
    if (input.value === 'custom') radiusInput.focus();
  }));

  async function geocode(query) {
    const url = 'https://nominatim.openstreetmap.org/search?' +
      new URLSearchParams({q: query, format: 'json', limit: 1});
    const response = await fetch(url, {headers: {'Accept': 'application/json'}});
    if (!response.ok) throw new Error('Geocoding failed');
    const results = await response.json();
    if (!results.length) return null;
    return [parseFloat(results[0].lat), parseFloat(results[0].lon)];
  }

  function renderJobs(data) {
    markers.clearLayers();
    list.replaceChildren();
    resultCount.textContent = `${data.count} job${data.count === 1 ? '' : 's'} in this area`;

    data.jobs.forEach(job => {
      if (job.latitude == null || job.longitude == null) return;

      const marker = L.marker([job.latitude, job.longitude]).addTo(markers);

      // Popup with a link to the application page
      const popup = document.createElement('div');

      const popupTitle = document.createElement('strong');
      popupTitle.textContent = job.title;

      const popupLocation = document.createElement('div');
      popupLocation.textContent = job.location;

      const applyLink = document.createElement('a');
      applyLink.href = applyUrl(job.id);
      applyLink.textContent = 'Apply now →';
      applyLink.style.display = 'inline-block';
      applyLink.style.marginTop = '6px';

      popup.append(popupTitle, popupLocation, applyLink);
      marker.bindPopup(popup);

      // Sidebar card (built with textContent so job data can't inject HTML)
      const card = document.createElement('article');
      card.className = 'map-job-card';

      const salary = job.salary_min || job.salary_max
        ? `${money(job.salary_min)}${job.salary_min && job.salary_max ? '–' : ''}${money(job.salary_max)}`
        : 'Salary not listed';

      const cardTitle = document.createElement('h3');
      cardTitle.textContent = job.title;

      const cardLocation = document.createElement('p');
      cardLocation.textContent =
        job.location + (job.distance_miles == null ? '' : ` · ${job.distance_miles} mi`);

      const cardSalary = document.createElement('span');
      cardSalary.textContent = salary;

      card.append(cardTitle, cardLocation, cardSalary);
      card.addEventListener('click', () => {
        map.setView([job.latitude, job.longitude], 14);
        marker.openPopup();
      });
      list.appendChild(card);
    });

    if (!data.count) {
      const empty = document.createElement('p');
      empty.className = 'empty-copy';
      empty.textContent = 'No jobs are available within this radius.';
      list.appendChild(empty);
    }
  }

  async function loadJobs() {
    const radius = getRadius();
    if (radius === null) {
      status.textContent = 'Enter a distance greater than 0 miles.';
      return;
    }
    status.textContent = 'Updating results…';
    const params = new URLSearchParams({lat: center[0], lng: center[1], radius});
    try {
      const response = await fetch(`{% url 'jobs:map_data' %}?${params}`);
      if (!response.ok) throw new Error('Unable to load jobs');
      const data = await response.json();
      renderJobs(data);

      circleLayer.clearLayers();
      const circle = L.circle(center, {radius: radius * 1609.34, weight: 1}).addTo(circleLayer);
      map.fitBounds(circle.getBounds());

      status.textContent = `${locationInput.value} · within ${radius} mi`;
    } catch (error) {
      resultCount.textContent = 'Jobs could not be loaded';
      status.textContent = 'Please try again.';
    }
  }

  form.addEventListener('submit', async event => {
    event.preventDefault();
    const query = locationInput.value.trim();

    // Only look up the location if the text changed since the last search
    if (query && query !== lastQuery) {
      status.textContent = 'Finding location…';
      try {
        const found = await geocode(query);
        if (!found) {
          status.textContent = `Couldn't find "${query}". Try a city or full address.`;
          return;
        }
        center = found;
        lastQuery = query;
      } catch (error) {
        status.textContent = 'Location lookup failed. Please try again.';
        return;
      }
    }
    loadJobs();
  });

  document.querySelector('#use-location').addEventListener('click', () => {
    if (!navigator.geolocation) {
      status.textContent = 'Location services are not available in this browser.';
      return;
    }
    status.textContent = 'Finding your location…';
    navigator.geolocation.getCurrentPosition(position => {
      center = [position.coords.latitude, position.coords.longitude];
      locationInput.value = 'Current location';
      lastQuery = 'Current location';
      loadJobs();
    }, () => {
      status.textContent = 'We could not access your location.';
    });
  });

  syncRadiusMode();
  loadJobs();
})();
</script>
{% endblock %}
